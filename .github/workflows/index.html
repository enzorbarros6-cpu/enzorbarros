<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game 🐍</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0d1117;
  color: #00ff88;
  font-family: Arial, sans-serif;
}

.container {
  width: min(95%, 500px);
  text-align: center;
}

h1 {
  font-size: 38px;
  text-shadow: 0 0 15px #00ff88;
}

.info {
  display: flex;
  justify-content: space-between;
  margin: 15px 0;
  font-size: 18px;
}

canvas {
  width: 100%;
  background: #010409;
  border: 2px solid #00ff88;
  border-radius: 8px;
  box-shadow: 0 0 20px #00ff8840;
}

button {
  background: #00ff88;
  color: #06140c;
  border: none;
  padding: 12px 20px;
  margin: 10px 4px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}

button:hover { background: #70ffb5; }

.controls {
  display: grid;
  grid-template-columns: repeat(3, 60px);
  justify-content: center;
  gap: 5px;
  margin-top: 12px;
}

.controls button {
  margin: 0;
  font-size: 22px;
  padding: 12px;
}

.empty { visibility: hidden; }

p { color: #8b949e; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>🐍 SNAKE GAME</h1>

  <div class="info">
    <span>🍎 Pontos: <b id="score">0</b></span>
    <span>🏆 Recorde: <b id="best">0</b></span>
  </div>

  <canvas id="game" width="400" height="400"></canvas>

  <div>
    <button id="start">▶ Começar</button>
    <button id="restart">↻ Reiniciar</button>
  </div>

  <div class="controls">
    <button class="empty"> </button>
    <button data-dir="up">⬆️</button>
    <button class="empty"> </button>
    <button data-dir="left">⬅️</button>
    <button data-dir="down">⬇️</button>
    <button data-dir="right">➡️</button>
  </div>

  <p>Use as setas do teclado ou os botões para jogar.</p>
  <p id="message">Clique em Começar para jogar!</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const size = 20;
const cells = canvas.width / size;

let snake, food, dx, dy, nextDx, nextDy;
let score = 0;
let best = 0;
let timer = null;
let running = false;
let ended = false;

try {
  best = Number(localStorage.getItem("snakeBest")) || 0;
} catch {}

document.getElementById("best").textContent = best;

function reset() {
  clearInterval(timer);
  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
  ];
  dx = 1;
  dy = 0;
  nextDx = 1;
  nextDy = 0;
  score = 0;
  running = false;
  ended = false;
  document.getElementById("score").textContent = score;
  document.getElementById("message").textContent =
    "Clique em Começar para jogar!";
  placeFood();
  draw();
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * cells),
      y: Math.floor(Math.random() * cells)
    };
  } while (snake.some(part =>
    part.x === food.x && part.y === food.y
  ));
}

function draw() {
  ctx.fillStyle = "#010409";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#12231d";
  ctx.lineWidth = 0.5;

  for (let i = 0; i <= cells; i++) {
    ctx.beginPath();
    ctx.moveTo(i * size, 0);
    ctx.lineTo(i * size, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, i * size);
    ctx.lineTo(canvas.width, i * size);
    ctx.stroke();
  }

  ctx.fillStyle = "#ff4757";
  ctx.shadowColor = "#ff4757";
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(
    food.x * size + size / 2,
    food.y * size + size / 2,
    size / 2 - 3,
    0,
    Math.PI * 2
  );
  ctx.fill();
  ctx.shadowBlur = 0;

  snake.forEach((part, i) => {
    ctx.fillStyle = i === 0 ? "#70ffb5" : "#00cc70";
    ctx.shadowColor = "#00ff88";
    ctx.shadowBlur = i === 0 ? 12 : 3;
    ctx.fillRect(
      part.x * size + 1,
      part.y * size + 1,
      size - 2,
      size - 2
    );
  });

  ctx.shadowBlur = 0;

  const head = snake[0];
  ctx.fillStyle = "#06140c";
  const eyeSize = 3;
  let eyes;

  if (dx === 1) {
    eyes = [[14, 5], [14, 13]];
  } else if (dx === -1) {
    eyes = [[4, 5], [4, 13]];
  } else if (dy === -1) {
    eyes = [[5, 4], [13, 4]];
  } else {
    eyes = [[5, 14], [13, 14]];
  }

  eyes.forEach(([ex, ey]) => {
    ctx.fillRect(
      head.x * size + ex,
      head.y * size + ey,
      eyeSize,
      eyeSize
    );
  });
}

function startGame() {
  if (running) return;
  if (ended) reset();

  running = true;
  document.getElementById("message").textContent = "Boa sorte! 🐍";
  clearInterval(timer);
  timer = setInterval(tick, Math.max(65, 140 - score * 2));
}

function tick() {
  dx = nextDx;
  dy = nextDy;

  const head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };

  const eating = head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0, -1);

  if (
    head.x < 0 || head.x >= cells ||
    head.y < 0 || head.y >= cells ||
    body.some(part => part.x === head.x && part.y === head.y)
  ) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (eating) {
    score++;
    document.getElementById("score").textContent = score;

    if (score > best) {
      best = score;
      document.getElementById("best").textContent = best;
      try {
        localStorage.setItem("snakeBest", best);
      } catch {}
    }

    placeFood();
    clearInterval(timer);
    timer = setInterval(tick, Math.max(65, 140 - score * 2));
  } else {
    snake.pop();
  }

  draw();
}

function gameOver() {
  clearInterval(timer);
  running = false;
  ended = true;
  document.getElementById("message").textContent =
    `💀 Fim de jogo! Você fez ${score} pontos.`;
  draw();

  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillRect(0, 145, 400, 110);
  ctx.fillStyle = "#ff4757";
  ctx.font = "bold 32px Arial";
  ctx.textAlign = "center";
  ctx.fillText("GAME OVER", 200, 195);
  ctx.fillStyle = "#ffffff";
  ctx.font = "18px Arial";
  ctx.fillText(`Pontos: ${score}`, 200, 228);
}

function changeDirection(dir) {
  const directions = {
    up: [0, -1],
    down: [0, 1],
    left: [-1, 0],
    right: [1, 0]
  };

  const [newDx, newDy] = directions[dir];
  if (newDx === undefined) return;

  if (newDx === -dx && newDy === -dy) return;

  nextDx = newDx;
  nextDy = newDy;

  if (!running && !ended) startGame();
}

document.addEventListener("keydown", event => {
  const keys = {
    ArrowUp: "up",
    ArrowDown: "down",
    ArrowLeft: "left",
    ArrowRight: "right",
    w: "up",
    s: "down",
    a: "left",
    d: "right"
  };

  if (keys[event.key]) {
    event.preventDefault();
    changeDirection(keys[event.key]);
  }

  if (event.code === "Space") {
    event.preventDefault();
    startGame();
  }
});

document.querySelectorAll("[data-dir]").forEach(button => {
  button.addEventListener("click", () => {
    changeDirection(button.dataset.dir);
  });
});

document.getElementById("start").addEventListener("click", startGame);
document.getElementById("restart").addEventListener("click", reset);

reset();
</script>
</body>
</html>
